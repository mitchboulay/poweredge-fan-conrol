# Bedrock pattern: publish a host port, let Caddy (CT 125) proxy
# fans.home.mbotech.net to it. No docker_compose_domains -> Coolify's Traefik
# stays out of the path. 18098 is a mnemonic for the iDRAC at 192.168.1.98.
services:
  fan-control:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Shutdown hands the fans back to Dell auto; give that ipmitool call time.
    stop_grace_period: 30s
    ports:
      - "${HOST_PORT:-18098}:8000"
    environment:
      IDRAC_ADDRESS: ${IDRAC_ADDRESS:-192.168.1.98}
      IDRAC_USER: ${IDRAC_USER:-root}
      IDRAC_PASSWORD: ${IDRAC_PASSWORD}   # set in Coolify
      STATE_PATH: /data/settings.json
    volumes:
      - fan-control-data:/data            # mode + curve, so a restart resumes them
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fan-control-data:
